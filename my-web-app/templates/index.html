<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BMI Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; }
    input, button { padding: 8px; margin: 4px 0; width: 100%; box-sizing: border-box; }
    .result { background: #e8f5e9; padding: 12px; margin-top: 16px; }
    .error { background: #ffebee; padding: 12px; margin-top: 16px; }
    small { color: #666; }
  </style>
</head>
<body>
  <h2>BMI Calculator</h2>
  <form method="post">
    <label>Weight (kg)</label>
    <input type="number" step="0.1" name="weight" required>
    <label>Height (cm)</label>
    <input type="number" step="0.1" name="height" required>
    <button type="submit">Calculate</button>
  </form>

  {% if result %}
  <div class="result">
    Your BMI is <b>{{ result.bmi }}</b> ({{ result.category }}).
  </div>
  {% endif %}
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <p><a href="/about">About</a> | <a href="/health">Health</a></p>
  <small>Served by container: {{ hostname }}</small>
</body>
</html>
